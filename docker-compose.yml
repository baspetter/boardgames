services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardgames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-boardgames}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardgames}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-boardgames}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-boardgames}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env, e.g. via 'openssl rand -base64 32'}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SEED_INVITE_CODE: ${SEED_INVITE_CODE:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
