services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardgames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-boardgames}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardgames}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-mode: runs the app straight from the bind-mounted source on the NAS
  # (no image build step). Upload a changed file and Next.js hot-reloads it
  # automatically — only package.json/schema changes need a container
  # restart ("docker compose restart app"), never a rebuild.
  app:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    command: sh dev-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-boardgames}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-boardgames}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SEED_INVITE_CODE: ${SEED_INVITE_CODE:-}
      BGG_API_TOKEN: ${BGG_API_TOKEN:-}
      NODE_ENV: development
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
